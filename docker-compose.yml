services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homefix
      POSTGRES_USER: homefix
      POSTGRES_PASSWORD: homefix
    ports:
      - "5432:5432"
    volumes:
      - homefix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix -d homefix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homefix-postgres-data:
